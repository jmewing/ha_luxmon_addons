name: lux-mon
version: "0.1.0"
slug: luxmon
description: Installs the lux-mon Home Assistant integration. Home Assistant Core will be restarted after installation.
url: https://github.com/jmewing/ha_luxmon
arch:
  - aarch64
  - amd64
startup: once
boot: manual_only
map:
  - type: homeassistant_config
    read_only: false
init: false
# Needs Supervisor API access with the "homeassistant" role to call
# bashio::core.restart (POST /core/restart) after installing the integration.
hassio_api: true
hassio_role: homeassistant
